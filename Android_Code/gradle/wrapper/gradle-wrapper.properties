# ============================================================
# Gradle wrapper properties - updated for Android 12
#
# Android Gradle Plugin 4.2.2 requires Gradle 6.7.1 or higher.
# Using Gradle 7.4.2 which is the latest stable version
# compatible with AGP 4.2.x and provides full Android 12
# (API 31) / Android 13 (API 33) support.
#
# The "-all" variant includes the Gradle source code and
# documentation, which is helpful for debugging build errors
# in Android Studio. Use "-bin" to save bandwidth if you
# don't need the docs.
# ============================================================

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-7.4.2-all.zip
