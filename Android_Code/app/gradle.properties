# Project-wide Gradle settings.
# AndroidX package structure (required for Android 12)
android.useAndroidX=true

# Android Gradle plugin 3.6+ uses this flag to enable non-transitive R classes
android.nonTransitiveRClass=true

# Enable parallel builds
org.gradle.parallel=true

# Enable daemon for faster builds
org.gradle.daemon=true

# Set memory for Gradle daemon (adjust based on your system)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
